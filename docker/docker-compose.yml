services:

  redis:
    image: redis:latest
    container_name: redis-primary
    command: redis-server --enable-debug-command yes --protected-mode no
    ports:
      - 6379:6379
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5

  sentinel:
    image: redis:latest
    container_name: redis-sentinel
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: "redis-sentinel /redis.conf --port 26379"
    ports:
      - 26379:26379
    volumes:
      - "./sentinel.conf:/redis.conf"
    healthcheck:
      test: redis-cli -p 26379 ping
      interval: 5s
      timeout: 5s
      retries: 5

  # Container that includes six Redis Cluster instances
  # (three masters and three slaves - each master has a slave)
  cluster:
    build:
      context: ./cluster
    image: redis-cluster-set:latest
    container_name: redis-cluster
    ports:
      - 6380:6380
      - 6381:6381
      - 6382:6382
      - 6383:6383
      - 6384:6384
      - 6385:6385
    volumes:
      - ./cluster/cluster-init.sh:/usr/local/bin/cluster-init.sh
      - ./cluster/redis.conf:/etc/redis/redis.conf
      - ./cluster/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
